{% extends "template.html" %}
{% block content %}
<div class="container" style="max-width: 550px; margin: 40px auto; padding: 25px; border-radius: 12px; background: rgba(18, 20, 25, 0.8); border: 1px solid rgba(255, 170, 0, 0.2);">
    <h2 style="color: #ffaa00; text-align: center; font-family: 'Vazir', sans-serif;"><i class="fas fa-key"></i> تغییر رمز عبور پنل</h2>
    <hr style="border-color: rgba(255, 170, 0, 0.1);">
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}" style="padding: 10px; margin-bottom: 15px; border-radius: 6px; font-weight: bold; background: rgba(255,71,87,0.1); color: #ff4757; border: 1px solid var(--red);">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="/change-password">
        <div class="form-group" style="margin-bottom: 15px;">
            <label style="color: #8b949e; font-weight: bold; display: block; margin-bottom: 5px;">رمز عبور جدید:</label>
            <input type="password" name="new_password" required placeholder="رمز عبور قوی و جدید را وارد کنید" style="width: 100%; padding: 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,170,0,0.2); color: #fff; border-radius: 6px;">
        </div>
        <button type="submit" class="btn" style="width: 100%; background: #ffaa00; color: #000; font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; transition: all 0.3s;">💾 ذخیره و ثبت رمز عبور</button>
    </form>
</div>
{% endblock %}
