{% extends "template.html" %}
{% block content %}
<div class="container" style="max-width: 500px; margin: 40px auto; padding: 28px; border-radius: 20px; background: rgba(18, 20, 25, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 170, 0, 0.3); box-shadow: 0 15px 40px rgba(0,0,0,0.8);">
    <h2 style="color: #ffaa00; text-align: center; margin-top: 0; font-size: 18px; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <i class="fas fa-key" style="color: #00f2ff;"></i>
        <span>تغییر کلمه عبور حساب کاربری</span>
    </h2>
    
    <hr style="border: none; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,170,0,0.3), transparent); margin: 20px 0;">
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}" style="padding: 12px 16px; margin-bottom: 18px; border-radius: 10px; font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 8px; {% if category == 'error' %}background: rgba(255,71,87,0.15); color: #ff4757; border: 1px solid rgba(255,71,87,0.4);{% else %}background: rgba(0,255,170,0.15); color: #00ffaa; border: 1px solid rgba(0,255,170,0.4);{% endif %}">
                    <i class="fas {{ 'fa-triangle-exclamation' if category == 'error' else 'fa-circle-check' }}"></i>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="/change-password" onsubmit="return validateChangePassword();">
        <div class="form-group" style="margin-bottom: 18px;">
            <label style="color: #8b949e; font-weight: bold; font-size: 12.5px; display: block; margin-bottom: 8px;">کلمه عبور جدید:</label>
            <div style="position: relative;">
                <input type="password" id="new_password" name="new_password" required placeholder="رمز عبور قوی و جدید را وارد کنید" style="width: 100%; padding: 12px 14px; background: rgba(5, 6, 8, 0.9); border: 1px solid rgba(255,170,0,0.3); color: #fff; border-radius: 10px; font-size: 13.5px; box-sizing: border-box;">
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 22px;">
            <label style="color: #8b949e; font-weight: bold; font-size: 12.5px; display: block; margin-bottom: 8px;">تکرار کلمه عبور جدید:</label>
            <div style="position: relative;">
                <input type="password" id="confirm_new_password" name="confirm_new_password" required placeholder="رمز عبور را مجدداً وارد کنید" style="width: 100%; padding: 12px 14px; background: rgba(5, 6, 8, 0.9); border: 1px solid rgba(255,170,0,0.3); color: #fff; border-radius: 10px; font-size: 13.5px; box-sizing: border-box;">
            </div>
        </div>

        <button type="submit" class="btn" style="width: 100%; background: linear-gradient(135deg, #ffaa00 0%, #ff5252 100%); color: #000; font-weight: 900; padding: 13px; border: none; border-radius: 10px; cursor: pointer; transition: all 0.3s; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <i class="fas fa-floppy-disk"></i>
            <span>ذخیره و به‌روزرسانی کلمه عبور</span>
        </button>
    </form>
</div>

<script>
function validateChangePassword() {
    const p1 = document.getElementById('new_password').value;
    const p2 = document.getElementById('confirm_new_password').value;
    if (p1 !== p2) {
        alert("کلمه عبور جدید با تکرار آن مطابقت ندارد.");
        return false;
    }
    return true;
}
</script>
{% endblock %}
