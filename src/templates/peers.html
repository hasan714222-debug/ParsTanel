<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peers Management | WireGuard Panel</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="/static/js/qrcode.min.js"></script>
    <script src="/static/js/peers.js" defer></script>
    <style>
        .peers-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .config-selector select, .search-filter input, .search-filter select {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 170, 0, 0.3);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 13px;
        }

        .search-filter {
            display: flex;
            gap: 10px;
            flex: 1;
            max-width: 450px;
        }

        .search-filter input {
            flex: 2;
        }

        .search-filter select {
            flex: 1;
        }

        .btn-action-primary {
            background: linear-gradient(135deg, #00f2ff, #10b981);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s;
        }

        .btn-action-primary:hover {
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
            transform: translateY(-2px);
        }

        .wg-floating-dropdown {
            display: none;
            position: absolute;
            background: #0c1017 !important;
            border: 1px solid rgba(0, 242, 255, 0.25) !important;
            border-radius: 12px !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8) !important;
            z-index: 100000 !important;
            width: 220px;
            padding: 6px 0;
        }

        .wg-floating-dropdown a {
            display: flex !important;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px !important;
            color: #c9d1d9 !important;
            text-decoration: none !important;
            font-size: 12px !important;
            font-weight: bold;
        }

        .wg-floating-dropdown a:hover {
            background: rgba(0, 242, 255, 0.1) !important;
            color: #00f2ff !important;
        }
    </style>
</head>

<body>
    {% include "sidebar.html" %}

    <div class="main-content">
        <h1 style="color:#fff; font-size:20px; margin-bottom:20px; display:flex; align-items:center; gap:10px;">
            <i class="fas fa-users" style="color:#ffaa00;"></i> Client Peers Management
        </h1>

        <!-- Top Action & Filter Controls -->
        <div class="peers-top-bar">
            <div class="config-selector">
                <label for="configSelect" style="font-weight:bold; color:#8b949e; margin-right:8px;">Interface:</label>
                <select id="configSelect">
                    <option value="wg0.conf" selected>wg0.conf</option>
                </select>
            </div>

            <div class="search-filter">
                <input type="text" id="searchInput" placeholder="Search by name or IP...">
                <select id="filterSelect">
                    <option value="">All Peers</option>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>
        </div>

        <!-- Peers Cards Grid -->
        <div id="peerContainer" class="container"></div>

        <!-- Pagination Controls -->
        <div id="paginationContainer" class="pagination"></div>

        <!-- QR Code Modal -->
        <div id="qrCodeModal" class="modal">
            <div class="modal-content" style="text-align: center; position: relative;">
                <span id="closeQrModal" class="close-modal">&times;</span>
                <h2 style="color:#00f2ff; margin-top:0;"><i class="fas fa-qrcode"></i> QR Code</h2>
                <canvas id="qrCodeCanvas" style="margin: 15px auto; display:block; border-radius:8px; border:2px solid #fff;"></canvas>
                <button id="saveQrCode" class="btn btn-action-primary" style="margin-top: 15px;"><i class="fas fa-download"></i> Save as PNG</button>
            </div>
        </div>

        <!-- Edit Peer Modal -->
        <div id="editPeerModal" class="modal">
            <div class="modal-content compact-modal">
                <span id="closeEditModal" class="close-modal">&times;</span>
                <h2 style="color:#00f2ff; margin-top:0;"><i class="fas fa-user-edit"></i> Edit Peer</h2>
                <form id="editPeerForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="editDataLimit">Data Limit:</label>
                            <div class="inline-fields" style="display:flex; gap:8px;">
                                <input type="number" id="editDataLimit" placeholder="Limit" style="flex:2;">
                                <select id="editDataLimitUnit" style="flex:1;">
                                    <option value="MB">MiB</option>
                                    <option value="GB" selected>GiB</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="editExpiry">Duration (Months, Days, Hours, Minutes):</label>
                            <div class="inline-fields" style="display:grid; grid-template-columns:repeat(4, 1fr); gap:6px;">
                                <input type="number" id="editExpiryMonths" placeholder="Mo" min="0">
                                <input type="number" id="editExpiryDays" placeholder="Day" min="0">
                                <input type="number" id="editExpiryHours" placeholder="Hr" min="0">
                                <input type="number" id="editExpiryMinutes" placeholder="Min" min="0">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="editDns">DNS Server:</label>
                            <input type="text" id="editDns" placeholder="1.1.1.1, 8.8.8.8">
                        </div>
                        <div class="form-group">
                            <label for="editPeerIp">Assigned IP:</label>
                            <input type="text" id="editPeerIp" readonly style="background:rgba(255,255,255,0.05); color:#8b949e;">
                        </div>
                    </div>
                    <div class="form-actions" style="margin-top:20px;">
                        <button type="submit" class="btn btn-action-primary" style="width:100%;">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Alert Modal -->
        <div id="alertModal" class="alert-modal">
            <div class="alert-modal-content">
                <p id="alertMessage">Notification</p>
            </div>
        </div>
        
        <!-- Confirm Modal -->
        <div id="confirmModal" class="confirm-modal">
            <div class="confirm-modal-content">
                <p id="confirmMessage">Are you sure?</p>
                <div class="confirm-actions">
                    <button id="confirmYes" class="btn btn-yes">Yes, Proceed</button>
                    <button id="confirmNo" class="btn btn-no">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="loading-spinner">
            <div class="spinner"></div>
            <p>Please wait a moment...</p>
        </div>

        <!-- Floating Multi-Server Download Menu Container -->
        <div id="wgFloatingDownloadMenu" class="wg-floating-dropdown"></div>

    </div>
</body>

</html>
