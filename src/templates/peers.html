<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/font-awesome.min.css">
    <script src="static/js/qrcode.min.js"></script>
    <script src="static/js/peers.js" defer></script>
</head>
<style>
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: 1000;
    justify-content: center;
    align-items: center;
}

.modal-content {
    position: relative;
    background: #fcfbfb;
    /*width: 350px;*/
    height: auto;
    border-radius: 10px;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 15px;
    font-size: 14px;
    color: #333; 
}

#peerContainer {
    display: flex;
    flex-wrap: wrap;
    gap: 5px; 
    padding: 10px;
}

.close-modal {
    position: absolute;
    top: 1px;
    right: 10px;
    color: #333;
    font-size: 24px;
    cursor: pointer;
    font-weight: bold;
    z-index: 100; 
}


.modal-content canvas {
    margin: 10px auto;
}

.modal-content button {
    margin-top: 20px;
}

.qr-code {
    display: block; 
    margin: 10px auto;
    width: 100px; 
    height: 100px; 
    border-radius: 8px; 
    background-color: #ffffff; 
    box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
}

.image-templates-container {
display: flex;
flex-wrap: wrap;
justify-content: space-around;
gap: 20px;
padding: 20px;
}

.peer-template {
    width: 220px; 
    height: 300px; 
    border-radius: 10px; 
    box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.2); 
    padding: 10px; 
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.peer-template:hover {
    transform: scale(1.03);
    box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.4);
}

.peer-template-overlay {
    position: absolute;
    bottom: 20px;
    left: 20px;
    color: #ffffff;
    font-size: 14px;
    line-height: 1.4;
    z-index: 2;
}

.peer-template .qr-code {
    width: 60px; 
    height: 60px;
    border-radius: 5px;
}
.btn {
    display: inline-block;
    padding: 8px 16px; 
    font-size: 12px; 
    border: none;
    border-radius: 5px;
    background-color: #1abc9c;
    color: white;
    cursor: pointer;
    transition: background-color 0.3s ease;
}
.pagination button {
    margin: 0 3px; 
    padding: 5px 10px; 
    font-size: 12px; 
}
.form-group input,
.form-group select {
    padding: 8px;
    font-size: 12px; 
}
.config-selector select {
    width: 50%;
    padding: 6px 10px;
    font-size: 13px;
    font-family: 'Poppins', Arial, sans-serif;
}
.search-filter input,
.search-filter select {
    padding: 8px; 
    font-size: 12px; 
}
.btn:hover {
    background-color: #0056b3;
}

</style>

<body>
    {% include "sidebar.html" %}

    <div class="main-content">

        <div class="config-selector">
            <label for="configSelect">Configuration:</label>
            <select id="configSelect">
                <option value="wg0.conf" selected>wg0.conf</option>
            </select>
        </div>

        <div class="search-filter">
            <input type="text" id="searchInput" placeholder="Search by Name or IP">
            <select id="filterSelect">
                <option value="">All</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
            </select>
        </div>

        <div id="peerContainer" class="container"></div>

        <div id="paginationContainer" class="pagination"></div>

        <div id="qrCodeModal" class="modal" style="display: none; justify-content: center; align-items: center;">
            <div class="modal-content" style="text-align: center; position: relative;">
                <span id="closeQrModal"
                    style="position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer;">&times;</span>
                <h2>QR Code</h2>
                <canvas id="qrCodeCanvas" style="margin: 20px auto;"></canvas>
                <button id="saveQrCode" style="margin-top: 15px;">Save as PNG</button>
            </div>
        </div>
        <div id="alertModal" class="alert-modal">
            <div class="alert-modal-content">
                <p id="alertMessage">Alert Message</p>
            </div>
        </div>
        
        <div id="confirmModal" class="confirm-modal">
            <div class="confirm-modal-content">
                <p id="confirmMessage">Are you sure?</p>
                <div class="confirm-actions">
                    <button id="confirmYes" class="btn btn-yes">Yes</button>
                    <button id="confirmNo" class="btn btn-no">No</button>
                </div>
            </div>
        </div>

        <div id="editPeerModal" class="modal">
            <div class="modal-content compact-modal">
                <span id="closeEditModal" class="close">&times;</span>
                <h2>Edit Peer</h2>
                <form id="editPeerForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="editDataLimit">Data Limit:</label>
                            <div class="inline-fields">
                                <input type="number" id="editDataLimit" placeholder="Enter new data limit"
                                    style="width: 70%;">
                                <select id="editDataLimitUnit" style="width: 25%;">
                                    <option value="MB">MiB</option>
                                    <option value="GB">GiB</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="editExpiry">Expiry (Months, Days, Hours, Minutes):</label>
                            <div class="inline-fields">
                                <input type="number" id="editExpiryMonths" placeholder="Months" min="0"
                                    style="width: 22%;">
                                <input type="number" id="editExpiryDays" placeholder="Days" min="0" style="width: 22%;">
                                <input type="number" id="editExpiryHours" placeholder="Hours" min="0"
                                    style="width: 22%;">
                                <input type="number" id="editExpiryMinutes" placeholder="Minutes" min="0"
                                    style="width: 22%;">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="editDns">DNS:</label>
                            <input type="text" id="editDns" placeholder="e.g., 1.1.1.1, 8.8.8.8" style="width: 100%;">
                        </div>
                        <div class="form-group">
                            <label for="editPeerIp">Peer IP:</label>
                            <input type="text" id="editPeerIp" readonly style="width: 100%; background-color: #f0f0f0;">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div id="loadingSpinner" class="loading-spinner">
        <div class="spinner"></div>
        <p> Please wait a sec...</p>
    </div>











<script src="https://unpkg.com/persian-date@1.1.0/dist/persian-date.min.js"></script>
<script src="https://unpkg.com/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    function injectBulkButtons() {
        const peerContainer = document.getElementById("peerContainer");
        if (peerContainer && !document.getElementById("bulkButtonsWrap")) {
            const wrap = document.createElement("div");
            wrap.id = "bulkButtonsWrap";
            wrap.className = "bulk-action-container";
            
            const isEn = document.documentElement.lang === 'en';
            
            wrap.innerHTML = `
                <button class="btn-bulk" onclick="openBulkModal('volume')"><i class="fas fa-database"></i> <span>${isEn ? 'Add Volume for All' : 'اضافه کردن حجم برای همه'}</span></button>
                <button class="btn-bulk time-btn" onclick="openBulkModal('time')"><i class="fas fa-clock"></i> <span>${isEn ? 'Add Time for All' : 'اضافه کردن زمان برای همه'}</span></button>
            `;
            peerContainer.parentNode.insertBefore(wrap, peerContainer);
        }
        toggleBulkButtonsVisibility();
    }
    
    function toggleBulkButtonsVisibility() {
        const configSelect = document.getElementById("configSelect") || document.getElementById("interfaceSelect");
        const wrap = document.getElementById("bulkButtonsWrap");
        if (wrap && configSelect) {
            wrap.style.display = (configSelect.value === 'wg0.conf' || configSelect.value === '') ? 'flex' : 'none';
        }
    }
    
    setTimeout(injectBulkButtons, 300);
    
    const configSelect = document.getElementById("configSelect") || document.getElementById("interfaceSelect");
    if(configSelect) configSelect.addEventListener("change", toggleBulkButtonsVisibility);
    
    document.getElementById("bulkExtendModal").addEventListener("click", function(e) {
        if(e.target === this) closeBulkModal();
    });

    // 🎯 راه‌اندازی تقویم با تنظیمات سخت‌گیرانه برای ارسال اعداد انگلیسی
    if(typeof $ !== 'undefined' && $.fn.persianDatepicker) {
        $('.date-picker-input').persianDatepicker({
            initialValue: false,
            autoShow: false,
            format: 'YYYY/MM/DD',
            autoClose: true,     
            observer: true,
            persianDigit: false, // جلوگیری قطعی از ارور 500 در بک‌اند (ارسال اعداد 123 به جای ۱۲۳)
            responsive: false, // جلوگیری قطعی از کشیده شدن و چسبیدن تقویم در موبایل
            toolbox: { calendarSwitch: { enabled: false } },
            navigator: { scroll: { enabled: false } },
            timePicker: { enabled: false }
        });
    }
});

function openBulkModal(type) {
    const modal = document.getElementById("bulkExtendModal");
    const titleText = document.getElementById("bulkTitleText");
    const label = document.getElementById("bulkAmountLabel");
    const desc = document.getElementById("bulkModalDesc");
    const lblStart = document.getElementById("lblStartDate");
    const lblEnd = document.getElementById("lblEndDate");
    const btnSubmit = document.getElementById("btnSubmitBulk");
    
    document.getElementById("bulkType").value = type;
    const isEn = document.documentElement.lang === 'en';
    
    desc.innerHTML = isEn ? 'If you leave dates empty, changes will apply to <b style="color:#fff;">ALL users</b> on the server. <br>(Note: Uses Connection Date, or Creation Date if not connected).' : 'در صورت خالی گذاشتن تاریخ‌ها، تغییرات روی <b style="color:#fff;">تمامی کاربران سرور</b> اعمال خواهد شد. <br><span style="color:#ffaa00;">(تاریخ‌ها بر اساس اولین اتصال یا ساخت کاربر محاسبه می‌شوند).</span>';
    
    lblStart.innerText = isEn ? 'From Date (Click):' : 'از تاریخ (انتخاب کنید):';
    lblEnd.innerText = isEn ? 'To Date (Click):' : 'تا تاریخ (انتخاب کنید):';
    btnSubmit.innerHTML = isEn ? '🚀 Apply Global Changes' : '🚀 اعمال تغییرات همگانی';

    if (type === 'volume') {
        modal.classList.remove('time-mode');
        titleText.innerText = isEn ? 'Bulk Volume Extend' : 'شارژ گروهی حجم';
        label.innerText = isEn ? 'Data amount to add (GB):' : 'مقدار حجم اضافه شونده (گیگابایت):';
    } else {
        modal.classList.add('time-mode');
        titleText.innerText = isEn ? 'Bulk Time Extend' : 'شارژ گروهی زمان';
        label.innerText = isEn ? 'Number of days to add:' : 'تعداد روز اضافه شونده:';
    }
    modal.classList.add("active");
}

function closeBulkModal() {
    document.getElementById("bulkExtendModal").classList.remove("active");
    if(typeof $ !== 'undefined') { $('.datepicker-plot-area').hide(); }
}

async function submitBulkExtend() {
    const type = document.getElementById("bulkType").value;
    const start = document.getElementById("bulkStartDate").value;
    const end = document.getElementById("bulkEndDate").value;
    const amount = document.getElementById("bulkAmount").value;
    const isEn = document.documentElement.lang === 'en';
    
    if (!amount || amount <= 0) {
        alert(isEn ? "Please enter a valid amount." : "لطفاً یک مقدار معتبر وارد کنید.");
        return;
    }
    
    const confirmMsg = (start || end) ? 
        (isEn ? `Apply changes to users connected in this date range?` : `آیا اطمینان دارید که می‌خواهید عملیات را روی کاربران این بازه تاریخی اعمال کنید؟`) : 
        (isEn ? `Warning! Dates are empty. This will apply to ALL users. Are you sure?` : `هشدار! تاریخ خالی است. عملیات روی تمامی کاربران سرور اعمال خواهد شد. مطمئن هستید؟`);
        
    if (!confirm(confirmMsg)) return;
    
    const btn = document.querySelector("#bulkExtendModal .btn-submit");
    const originalText = btn.innerHTML;
    btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${isEn ? 'Processing...' : 'در حال پردازش...'}`;
    btn.disabled = true;
    
    try {
        const res = await fetch("/api/bulk-extend", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ type: type, amount: amount, start_date: start, end_date: end })
        });
        const data = await res.json();
        
        if (res.ok && data.message) {
            alert(data.message);
            closeBulkModal();
            location.reload(); 
        } else {
            alert(data.error || (isEn ? "Unknown server error." : "خطای ناشناخته در سرور."));
        }
    } catch(e) {
        alert(isEn ? "Connection error." : "خطا در ارتباط با سرور.");
    } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
}
</script>

function openBulkModal(type) {
    const modal = document.getElementById("bulkExtendModal");
    const titleText = document.getElementById("bulkTitleText");
    const label = document.getElementById("bulkAmountLabel");
    const desc = document.getElementById("bulkModalDesc");
    const lblStart = document.getElementById("lblStartDate");
    const lblEnd = document.getElementById("lblEndDate");
    const btnSubmit = document.getElementById("btnSubmitBulk");
    
    document.getElementById("bulkType").value = type;
    const isEn = document.documentElement.lang === 'en';
    
    desc.innerHTML = isEn ? 'If you leave dates empty, changes will apply to <b style="color:#fff;">ALL users</b> on the server. <br>(Note: Uses Connection Date, or Creation Date if not connected).' : 'در صورت خالی گذاشتن تاریخ‌ها، تغییرات روی <b style="color:#fff;">تمامی کاربران سرور</b> اعمال خواهد شد. <br><span style="color:#ffaa00;">(تاریخ‌ها بر اساس اولین اتصال یا ساخت کاربر محاسبه می‌شوند).</span>';
    
    lblStart.innerText = isEn ? 'From Date (Click):' : 'از تاریخ (انتخاب کنید):';
    lblEnd.innerText = isEn ? 'To Date (Click):' : 'تا تاریخ (انتخاب کنید):';
    btnSubmit.innerHTML = isEn ? '🚀 Apply Global Changes' : '🚀 اعمال تغییرات همگانی';

    if (type === 'volume') {
        modal.classList.remove('time-mode');
        titleText.innerText = isEn ? 'Bulk Volume Extend' : 'شارژ گروهی حجم';
        label.innerText = isEn ? 'Data amount to add (GB):' : 'مقدار حجم اضافه شونده (گیگابایت):';
    } else {
        modal.classList.add('time-mode');
        titleText.innerText = isEn ? 'Bulk Time Extend' : 'شارژ گروهی زمان';
        label.innerText = isEn ? 'Number of days to add:' : 'تعداد روز اضافه شونده:';
    }
    modal.classList.add("active");
}

function closeBulkModal() {
    document.getElementById("bulkExtendModal").classList.remove("active");
    if(typeof $ !== 'undefined') { $('.datepicker-plot-area').hide(); }
}

async function submitBulkExtend() {
    const type = document.getElementById("bulkType").value;
    const start = document.getElementById("bulkStartDate").value;
    const end = document.getElementById("bulkEndDate").value;
    const amount = document.getElementById("bulkAmount").value;
    const isEn = document.documentElement.lang === 'en';
    
    if (!amount || amount <= 0) {
        alert(isEn ? "Please enter a valid amount." : "لطفاً یک مقدار معتبر وارد کنید.");
        return;
    }
    
    const confirmMsg = (start || end) ? 
        (isEn ? `Apply changes to users connected in this date range?` : `آیا اطمینان دارید که می‌خواهید عملیات را روی کاربران این بازه تاریخی اعمال کنید؟`) : 
        (isEn ? `Warning! Dates are empty. This will apply to ALL users. Are you sure?` : `هشدار! تاریخ خالی است. عملیات روی تمامی کاربران سرور اعمال خواهد شد. مطمئن هستید؟`);
        
    if (!confirm(confirmMsg)) return;
    
    const btn = document.querySelector("#bulkExtendModal .btn-submit");
    const originalText = btn.innerHTML;
    btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${isEn ? 'Processing...' : 'در حال پردازش...'}`;
    btn.disabled = true;
    
    try {
        const res = await fetch("/api/bulk-extend", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ type: type, amount: amount, start_date: start, end_date: end })
        });
        const data = await res.json();
        
        if (res.ok && data.message) {
            alert(data.message);
            closeBulkModal();
            location.reload(); 
        } else {
            alert(data.error || (isEn ? "Unknown server error." : "خطای ناشناخته در سرور."));
        }
    } catch(e) {
        alert(isEn ? "Connection error." : "خطا در ارتباط با سرور.");
    } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
}
</script>

<!--  PERFECT 10-COLUMN ROW PAGINATION -->
<script>
if (typeof peersPerPage !== 'undefined') peersPerPage = window.innerWidth > 768 ? 21 : 10;
if (typeof itemsPerPage !== 'undefined') itemsPerPage = window.innerWidth > 768 ? 21 : 10;
if (typeof perPage !== 'undefined') perPage = window.innerWidth > 768 ? 21 : 10;

window.renderPagination = function() {
    const container = document.getElementById('paginationContainer');
    if (!container) return;
    
    container.innerHTML = '';
    container.className = 'wg-pagination-master';

    const isRTL = document.body.style.direction === 'rtl' || document.documentElement.dir === 'rtl' || window.location.pathname.includes('-fa');
    let t_pages = (typeof totalPages !== 'undefined') ? totalPages : (typeof total_pages !== 'undefined' ? total_pages : 0);
    let c_page = (typeof currentPage !== 'undefined') ? currentPage : (typeof current_page !== 'undefined' ? current_page : 1);

    let pageList = [];
    if (t_pages <= 21) {
        for (let p = 1; p <= t_pages; p++) pageList.push(p);
    } else {
        for (let p = 1; p <= 20; p++) pageList.push(p);
        pageList.push('...');
        pageList.push(t_pages);
    }

    const chunks = [];
    for (let i = 0; i < pageList.length; i += 10) {
        chunks.push(pageList.slice(i, i + 10));
    }

    let htmlContent = '';
    chunks.forEach(chunk => {
        htmlContent += '<div class="wg-chunk-row">';
        chunk.forEach(i => {
            if (i === '...') {
                htmlContent += '<span class="wg-dots">...</span>';
            } else {
                let activeClass = (i === c_page) ? 'wg-btn-active' : '';
                htmlContent += `<button class="wg-ultimate-btn ${activeClass}" onclick="currentPage=${i}; if(typeof fetchPeers==='function')fetchPeers(); else if(typeof loadPeers==='function')loadPeers();">${i}</button>`;
            }
        });
        htmlContent += '</div>'; 
    });

    if (t_pages > 1) {
        let prevText = isRTL ? ' ' : 'Prev';
        let nextText = isRTL ? ' ' : 'Next';
        
        htmlContent += `<div class="wg-nav-row ${isRTL ? 'rtl-nav' : 'ltr-nav'}">`;
        if (c_page > 1) htmlContent += `<button class="wg-nav-btn" onclick="currentPage--; if(typeof fetchPeers==='function')fetchPeers(); else if(typeof loadPeers==='function')loadPeers();">${prevText}</button>`;
        if (c_page < t_pages) htmlContent += `<button class="wg-nav-btn" onclick="currentPage++; if(typeof fetchPeers==='function')fetchPeers(); else if(typeof loadPeers==='function')loadPeers();">${nextText}</button>`;
        htmlContent += `</div>`;
    }

    container.innerHTML = htmlContent;
};
</script>

<!-- 🎯 AUTOMATIC FREE IP INJECTOR (STEP 39 - ULTIMATE) -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    function autoFillFreeIP() {
        const ipInput = document.getElementById("peerIp") || document.getElementById("peer_ip") || document.getElementById("ipv4") || document.querySelector("input[name='peer_ip']") || document.querySelector("input[placeholder*='10.0.']");
        if (!ipInput) return;
        
        // فیلتر سخت‌گیرانه برای ممانعت از بازنویسی فیلد نام کاربری (peerName)
        if (ipInput.id.toLowerCase().includes("name") || ipInput.name.toLowerCase().includes("name")) {
            return; 
        }
        
        if (ipInput.value === "" || ipInput.value === "در حال استخراج...") {
            const configSelect = document.getElementById("configSelect") || document.getElementById("interfaceSelect") || document.querySelector("select[name='config']");
            const selectedConfig = configSelect ? configSelect.value : "wg0.conf";
            
            ipInput.value = "در حال استخراج...";
            fetch("/api/get-free-ip?config=" + selectedConfig)
                .then(res => res.json())
                .then(data => {
                    if (data.free_ip) {
                        ipInput.value = data.free_ip;
                    } else {
                        ipInput.value = "";
                    }
                })
                .catch(() => {
                    ipInput.value = "";
                });
        }
    }

    const targetButtons = [
        document.getElementById("addPeerBtn"),
        document.getElementById("add-peer-btn"),
        document.querySelector("[data-target='#addPeerModal']"),
        document.querySelector("[onclick*='addPeer']"),
        document.querySelector(".btn-add-peer")
    ];
    targetButtons.forEach(btn => {
        if (btn) {
            btn.addEventListener("click", () => setTimeout(autoFillFreeIP, 350));
        }
    });

    const configSelect = document.getElementById("configSelect") || document.getElementById("interfaceSelect") || document.querySelector("select[name='config']");
    if (configSelect) {
        configSelect.addEventListener("change", () => {
            const ipInput = document.getElementById("peerIp") || document.getElementById("peer_ip");
            if (ipInput) ipInput.value = "";
            autoFillFreeIP();
        });
    }
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const menu = document.getElementById("wgFloatingDownloadMenu");
    
    document.addEventListener("click", async function(e) {
        // شنود همه‌جانبه‌ی واقعی برای فعال‌سازی کامل منوی شناور در تمام کادرهای پنل
        const dlBtn = e.target.closest(".download-btn") || 
                      e.target.closest("[id*='download']") || 
                      e.target.closest(".btn-download") || 
                      e.target.closest("[href*='download']") || 
                      e.target.closest(".fa-download") || 
                      e.target.closest(".fas.fa-download") ||
                      (e.target.tagName === 'A' && e.target.innerText.includes('دانلود')) ||
                      (e.target.tagName === 'A' && e.target.innerText.toLowerCase().includes('download'));
                      
        if (!dlBtn) {
            if (menu) menu.style.display = "none";
            return;
        }
        
        const card = dlBtn.closest(".peer-box") || dlBtn.closest(".peer-card") || dlBtn.closest("tr") || dlBtn.closest(".card");
        if (!card) return;
        
        e.preventDefault(); e.stopPropagation();
        
        let peerName = "";
        const strongEl = card.querySelector("strong") || card.querySelector(".peer-name") || card.querySelector("td:first-child");
        if (strongEl) peerName = strongEl.innerText.trim().split(" ")[0];
        
        const configSelect = document.getElementById("configSelect") || document.getElementById("interfaceSelect");
        const activeConfig = configSelect ? configSelect.value : "wg0.conf";
        
        if (!peerName) return;
        
        if (menu) {
            menu.innerHTML = "<div style='padding:10px; color:#aaa; font-size:11px; text-align:center;'>در حال بارگذاری...</div>";
            const rect = dlBtn.getBoundingClientRect();
            menu.style.top = (window.scrollY + rect.bottom + 5) + "px";
            menu.style.left = (window.scrollX + rect.left) + "px";
            menu.style.display = "block";
        }
        
        try {
            const res = await fetch("/api/edge-servers");
            const edges = await res.json();
            
            menu.innerHTML = "";
            
            const itemMaster = document.createElement("a");
            itemMaster.href = `/api/download-peer-config?peer_name=${peerName}&config=${activeConfig}`;
            itemMaster.innerHTML = `<span>🇩🇪 سرور اصلی (Master)</span> <i class="fas fa-download" style="font-size:10px; color:#ffaa00;"></i>`;
            menu.appendChild(itemMaster);
            
            edges.forEach(srv => {
                const itemEdge = document.createElement("a");
                itemEdge.href = `/s/${peerName}/download/main_${srv.server_ip}`;
                itemEdge.innerHTML = `<span>${srv.flag} ${srv.location}</span> <i class="fas fa-download" style="font-size:10px; color:#10b981;"></i>`;
                menu.appendChild(itemEdge);
            });
            
        } catch(err) { console.error("Floating menu error:", err); }
    });
    
    document.addEventListener("click", function() {
        if (menu) menu.style.display = "none";
    });
});
</script>

                <input type="text" id="bulkStartDate" class="date-picker-input" placeholder="مثال: 1403/01/01" readonly style="cursor: pointer;" autocomplete="off">
            </div>
            <div style="flex:1; min-width:140px;">
                <label id="lblEndDate">تا تاریخ ساخت/اتصال (انتخاب کنید):</label>

<script>
document.addEventListener("DOMContentLoaded", function() {
    function injectBulkButtons() {
        const peerContainer = document.getElementById("peerContainer");
        if (peerContainer && !document.getElementById("bulkButtonsWrap")) {
            const wrap = document.createElement("div");
            wrap.id = "bulkButtonsWrap";
            wrap.className = "bulk-action-container";
            
            const isEn = document.documentElement.lang === 'en';
            
            wrap.innerHTML = `
                <button class="btn-bulk" onclick="openBulkModal('volume')"><i class="fas fa-database"></i> <span>${isEn ? 'Add Volume for All' : 'اضافه کردن حجم برای همه'}</span></button>
                <button class="btn-bulk time-btn" onclick="openBulkModal('time')"><i class="fas fa-clock"></i> <span>${isEn ? 'Add Time for All' : 'اضافه کردن زمان برای همه'}</span></button>
            `;
            peerContainer.parentNode.insertBefore(wrap, peerContainer);
        }
        toggleBulkButtonsVisibility();
    }
    
    function toggleBulkButtonsVisibility() {
        const configSelect = document.getElementById("configSelect") || document.getElementById("interfaceSelect");
        const wrap = document.getElementById("bulkButtonsWrap");
        if (wrap && configSelect) {
            wrap.style.display = (configSelect.value === 'wg0.conf' || configSelect.value === '') ? 'flex' : 'none';
        }
    }
    
    setTimeout(injectBulkButtons, 300);
    
    const configSelect = document.getElementById("configSelect") || document.getElementById("interfaceSelect");
    if(configSelect) configSelect.addEventListener("change", toggleBulkButtonsVisibility);
    
    document.getElementById("bulkExtendModal").addEventListener("click", function(e) {
        if(e.target === this) closeBulkModal();
    });

    // 🎯 راه‌اندازی تقویم با تنظیمات سخت‌گیرانه برای ارسال اعداد انگلیسی
    if(typeof $ !== 'undefined' && $.fn.persianDatepicker) {
        $('.date-picker-input').persianDatepicker({
            initialValue: false,
            autoShow: false,
            format: 'YYYY/MM/DD',
            autoClose: true,     
            observer: true,
            persianDigit: false, // جلوگیری قطعی از ارور 500 در بک‌اند (ارسال اعداد 123 به جای ۱۲۳)
            responsive: false, // جلوگیری قطعی از کشیده شدن و چسبیدن تقویم در موبایل
            toolbox: { calendarSwitch: { enabled: false } },
            navigator: { scroll: { enabled: false } },
            timePicker: { enabled: false }
        });
    }
});

function openBulkModal(type) {
    const modal = document.getElementById("bulkExtendModal");
    const titleText = document.getElementById("bulkTitleText");
    const label = document.getElementById("bulkAmountLabel");
    const desc = document.getElementById("bulkModalDesc");
    const lblStart = document.getElementById("lblStartDate");
    const lblEnd = document.getElementById("lblEndDate");
    const btnSubmit = document.getElementById("btnSubmitBulk");
    
    document.getElementById("bulkType").value = type;
    const isEn = document.documentElement.lang === 'en';
    
    desc.innerHTML = isEn ? 'If you leave dates empty, changes will apply to <b style="color:#fff;">ALL users</b> on the server. <br>(Note: Uses Connection Date, or Creation Date if not connected).' : 'در صورت خالی گذاشتن تاریخ‌ها، تغییرات روی <b style="color:#fff;">تمامی کاربران سرور</b> اعمال خواهد شد. <br><span style="color:#ffaa00;">(تاریخ‌ها بر اساس اولین اتصال یا ساخت کاربر محاسبه می‌شوند).</span>';
    
    lblStart.innerText = isEn ? 'From Date (Click):' : 'از تاریخ (انتخاب کنید):';
    lblEnd.innerText = isEn ? 'To Date (Click):' : 'تا تاریخ (انتخاب کنید):';
    btnSubmit.innerHTML = isEn ? '🚀 Apply Global Changes' : '🚀 اعمال تغییرات همگانی';

    if (type === 'volume') {
        modal.classList.remove('time-mode');
        titleText.innerText = isEn ? 'Bulk Volume Extend' : 'شارژ گروهی حجم';
        label.innerText = isEn ? 'Data amount to add (GB):' : 'مقدار حجم اضافه شونده (گیگابایت):';
    } else {
        modal.classList.add('time-mode');
        titleText.innerText = isEn ? 'Bulk Time Extend' : 'شارژ گروهی زمان';
        label.innerText = isEn ? 'Number of days to add:' : 'تعداد روز اضافه شونده:';
    }
    modal.classList.add("active");
}

function closeBulkModal() {
    document.getElementById("bulkExtendModal").classList.remove("active");
    if(typeof $ !== 'undefined') { $('.datepicker-plot-area').hide(); }
}

async function submitBulkExtend() {
    const type = document.getElementById("bulkType").value;
    const start = document.getElementById("bulkStartDate").value;
    const end = document.getElementById("bulkEndDate").value;
    const amount = document.getElementById("bulkAmount").value;
    const isEn = document.documentElement.lang === 'en';
    
    if (!amount || amount <= 0) {
        alert(isEn ? "Please enter a valid amount." : "لطفاً یک مقدار معتبر وارد کنید.");
        return;
    }
    
    const confirmMsg = (start || end) ? 
        (isEn ? `Apply changes to users connected in this date range?` : `آیا اطمینان دارید که می‌خواهید عملیات را روی کاربران این بازه تاریخی اعمال کنید؟`) : 
        (isEn ? `Warning! Dates are empty. This will apply to ALL users. Are you sure?` : `هشدار! تاریخ خالی است. عملیات روی تمامی کاربران سرور اعمال خواهد شد. مطمئن هستید؟`);
        
    if (!confirm(confirmMsg)) return;
    
    const btn = document.querySelector("#bulkExtendModal .btn-submit");
    const originalText = btn.innerHTML;
    btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${isEn ? 'Processing...' : 'در حال پردازش...'}`;
    btn.disabled = true;
    
    try {
        const res = await fetch("/api/bulk-extend", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ type: type, amount: amount, start_date: start, end_date: end })
        });
        const data = await res.json();
        
        if (res.ok && data.message) {
            alert(data.message);
            closeBulkModal();
            location.reload(); 
        } else {
            alert(data.error || (isEn ? "Unknown server error." : "خطای ناشناخته در سرور."));
        }
    } catch(e) {
        alert(isEn ? "Connection error." : "خطا در ارتباط با سرور.");
    } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
    }
}
</script>

<script>
// --- 🎯 UNIFIED 4-MODE DATEPICKER & SMOOTH RINGS ENGINE ---
(function() {
    // A. روان‌سازی حلقه‌های رادار (جلوگیری از پرش به صفر)
    let masterRingState = { cpu: 15, ram: 25, disk: 30, uptime: "0.00 KB" };
    let isRingUpdating = false;

    window.updateDashboardRingsUnified = async function() {
        if (isRingUpdating) return;
        isRingUpdating = true;
        try {
            const res = await fetch('/api/metrics');
            if (!res.ok) return;
            const data = await res.json();

            function parseMetric(val, lastVal) {
                if (typeof val === 'number' && !isNaN(val)) return val;
                if (typeof val === 'string') {
                    let parsed = parseFloat(val.replace('%', '').trim());
                    if (!isNaN(parsed)) return parsed;
                }
                if (val && typeof val.percent !== 'undefined') {
                    let parsed = parseFloat(val.percent);
                    if (!isNaN(parsed)) return parsed;
                }
                return lastVal;
            }

            let cpu = parseMetric(data.cpu, masterRingState.cpu);
            let ram = parseMetric(data.ram, masterRingState.ram);
            let disk = parseMetric(data.disk || data.disk_percent, masterRingState.disk);

            masterRingState.cpu = cpu;
            masterRingState.ram = ram;
            masterRingState.disk = disk;
            if (data.uptime) masterRingState.uptime = data.uptime;

            function animateRing(valId, ringId, pct) {
                const valEl = document.getElementById(valId);
                const ringEl = document.getElementById(ringId);
                let validPct = Math.min(100, Math.max(0, pct));

                if (valEl) valEl.innerText = Math.round(validPct) + "%";
                if (ringEl && ringEl.r && ringEl.r.baseVal) {
                    let radius = ringEl.r.baseVal.value || 55;
                    let circ = 2 * Math.PI * radius;
                    ringEl.style.strokeDasharray = circ;
                    ringEl.style.strokeDashoffset = circ - (validPct / 100) * circ;

                    if (validPct > 85) ringEl.style.stroke = "#ff4757";
                    else if (validPct > 65) ringEl.style.stroke = "#ffaa00";
                    else ringEl.style.stroke = "#00f2ff";
                }
            }

            animateRing("cpu-value", "cpu-progress", cpu);
            animateRing("ram-value", "ram-progress", ram);
            animateRing("disk-value", "disk-progress", disk);

            const uptimeVal = document.getElementById("uptime-value") || document.getElementById("uptime");
            if (uptimeVal && masterRingState.uptime) uptimeVal.innerText = masterRingState.uptime;

        } catch(e) {}
        finally { isRingUpdating = false; }
    };

    // B. مدیریت تقویم ۴ حالته (فارسی/انگلیسی × دسکتاپ/موبایل)
    window.setupUniversal4ModeDatepicker = function() {
        const isPersian = document.documentElement.lang === 'fa' || 
                          window.location.pathname.includes('-fa') || 
                          document.body.dir === 'rtl';

        const startIn = document.getElementById("bulkStartDate");
        const endIn = document.getElementById("bulkEndDate");

        if (!startIn || !endIn) return;

        if (!isPersian) {
            // انگلیسی (دسکتاپ و موبایل): تبدیل به Input type="date" نیتیو
            [startIn, endIn].forEach(el => {
                el.type = "date";
                el.removeAttribute("readonly");
                el.classList.add("date-picker-input");
                el.placeholder = "YYYY-MM-DD";
            });
            if (typeof $ !== 'undefined' && $.fn.persianDatepicker) {
                try { $(startIn).persianDatepicker('destroy'); $(endIn).persianDatepicker('destroy'); } catch(e){}
            }
        } else {
            // فارسی (دسکتاپ و موبایل): راه‌اندازی تقویم شمسی نئونی
            if (typeof $ !== 'undefined' && $.fn.persianDatepicker) {
                $('.date-picker-input').persianDatepicker({
                    initialValue: false,
                    autoShow: false,
                    format: 'YYYY/MM/DD',
                    autoClose: true,
                    observer: true,
                    persianDigit: false,
                    responsive: true,
                    toolbox: { calendarSwitch: { enabled: false } },
                    timePicker: { enabled: false }
                });
            }
        }
    };

    document.addEventListener("DOMContentLoaded", function() {
        // حذف تایمرهای تکراری قدیمی
        if (window.metricsInterval) clearInterval(window.metricsInterval);
        if (window.ringsInterval) clearInterval(window.ringsInterval);

        window.updateDashboardRingsUnified();
        window.metricsInterval = setInterval(window.updateDashboardRingsUnified, 3000);

        window.setupUniversal4ModeDatepicker();
    });
})();
</script>
