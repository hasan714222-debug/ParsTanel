<button id="mobileHamburger" class="mobile-hamburger" onclick="openMobileMenu()" aria-label="Mobile Navigation"><i class="fas fa-bars"></i></button>
<div id="sidebarOverlay" class="sidebar-overlay" onclick="closeMobileMenu()"></div>

<div class="sidebar collapsed" id="sidebar">
    <div class="user-info">
        <i class="fas fa-user-circle"></i>
        <span class="nav-text">{{ username }}</span>
    </div>
    <ul class="nav-links">
        <li><a href="/home" class="{{ 'active' if request.path == '/home' else '' }}"><i class="fas fa-home"></i> <span class="nav-text">Dashboard</span></a></li>
        <li><a href="/peers" class="{{ 'active' if request.path == '/peers' else '' }}"><i class="fas fa-users"></i> <span class="nav-text">Peers</span></a></li>
        <li><a href="/bot" class="{{ 'active' if request.path == '/bot' else '' }}"><i class="fab fa-telegram-plane"></i> <span class="nav-text">Telegram Bot</span></a></li>

        {% if session.get('role') != 'client' %}
        <li><a href="/advanced" class="{{ 'active' if request.path == '/advanced' else '' }}"><i class="fas fa-sliders-h" style="color: #00f2ff;"></i> <span class="nav-text" style="color: #00f2ff; font-weight: bold;">Advanced</span></a></li>
        <li><a href="/settings" class="{{ 'active' if request.path == '/settings' else '' }}"><i class="fas fa-cog"></i> <span class="nav-text">Settings</span></a></li>
        <li><a href="/backups" class="{{ 'active' if request.path == '/backups' else '' }}"><i class="fas fa-database"></i> <span class="nav-text">Backups</span></a></li>
        {% endif %}

        <li class="logout-li"><a href="/logout" class="logout-link"><i class="fas fa-sign-out-alt"></i> <span class="nav-text">Logout</span></a></li>
        <form id="langFormFA" action="/set-language" method="POST" style="display:none;"><input type="hidden" name="language" value="fa"></form>
        <li class="lang-li">
            <a href="javascript:void(0)" onclick="document.getElementById('langFormFA').submit();">
                <div class="icon-wrapper"><i class="fas fa-globe"></i><span class="collapsed-lang-badge">FA</span></div>
                <span class="nav-text lang-text"><span style="font-family:'Poppins', sans-serif;">فارسی</span><span style="font-size:16px;">🇮🇷</span></span>
            </a>
        </li>
        <li class="toggle-li"><a href="javascript:void(0)" id="sidebarToggle" class="toggle-link" onclick="toggleDesktopMenu()"><i class="fas fa-chevron-left" id="toggleIcon"></i><span class="nav-text">Open</span></a></li>

        <li class="special-mode-li" style="padding: 15px 20px; display: flex; align-items: center; gap: 10px; border-top: 1px dashed rgba(255,255,255,0.05); cursor: pointer;" onclick="toggleSpecialModeClick(event)">
            <div class="icon-wrapper" style="display: flex; align-items: center; justify-content: center; width: 24px; min-width: 24px;">
                <i class="fas fa-magic" style="color: #ffaa00; font-size: 18px;" id="specialModeIcon"></i>
            </div>
            <span class="nav-text" style="font-weight: bold; color: #ffaa00; font-size: 13px; margin-left: 10px;">Special Mode</span>

            <label class="switch" style="position: relative; display: inline-block; width: 40px; height: 20px; margin-left: auto;" onclick="event.stopPropagation()">
                <input type="checkbox" id="specialModeToggle" checked onchange="toggleSpecialModeState()" style="opacity: 0; width: 0; height: 0;">
                <span class="slider round" style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 34px;" id="specialModeSlider"></span>
            </label>
            <i class="fa fa-info-circle" style="cursor: pointer; color: #ffaa00; font-size: 14px; margin-left: 5px;" onclick="showSpecialModeInfo(event)" title="Information"></i>
        </li>
    </ul>
</div>

<script>
    const slider = document.getElementById("specialModeSlider");
    const toggle = document.getElementById("specialModeToggle");
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const toggleIcon = document.getElementById('toggleIcon');
    const mainContent = document.querySelector('.main-content');
    const toggleText = document.querySelector('.toggle-link .nav-text');

    function updateSliderColor(checked) {
        if (slider) {
            slider.style.backgroundColor = checked ? "#ffaa00" : "#333";
            slider.style.boxShadow = checked ? "0 0 10px rgba(255, 170, 0, 0.4)" : "none";
        }
    }

    async function loadSpecialModeState() {
        if(!toggle) return;
        try {
            const res = await fetch("/api/client-special-mode");
            const data = await res.json();
            if (data && data.special_mode !== undefined) {
                toggle.checked = (data.special_mode === 1);
                updateSliderColor(data.special_mode === 1);
                toggleSpecialModeFields(data.special_mode === 1);
            }
        } catch(e) {
            console.error("Error loading Special Mode state:", e);
        }
    }

    async function toggleSpecialModeState() {
        if(!toggle) return;
        const checked = toggle.checked;
        updateSliderColor(checked);
        const mode = checked ? 1 : 0;
        try {
            await fetch("/api/client-special-mode", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({special_mode: mode})
            });
            toggleSpecialModeFields(checked);
        } catch(e) {
            console.error("Error updating Special Mode:", e);
        }
    }

    function toggleSpecialModeClick(event) {
        if (!toggle) return;
        if (event.target === toggle || event.target === slider) return;
        toggle.click();
    }

    function toggleSpecialModeFields(isSpecial) {
        const fields = ['#wgMTU', '#wgDNS', '#wgPort', '#mtu', '#dns', '#persistentKeepalive', '#allowedIps'];
        fields.forEach(sel => {
            const el = document.querySelector(sel) || document.getElementById(sel.replace("#",""));
            if (el) {
                const group = el.closest(".form-group") || el.parentElement;
                if (group) group.style.display = isSpecial ? "none" : "block";
            }
        });
    }

    function showSpecialModeInfo(event) {
        if(event) event.stopPropagation();
        alert("💡 Special Mode Guide:\n\nWhen enabled, advanced options and cluster multi-configurations are generated automatically.");
    }

    function openMobileMenu() { 
        if(!sidebar || !overlay) return;
        sidebar.classList.remove('collapsed'); 
        sidebar.classList.add('mobile-open'); 
        overlay.classList.add('active'); 
    }
    
    function closeMobileMenu() { 
        if(!sidebar || !overlay) return;
        sidebar.classList.remove('mobile-open'); 
        sidebar.classList.add('collapsed'); 
        overlay.classList.remove('active'); 
    }
    
    function toggleDesktopMenu() {
        if(window.innerWidth <= 768 || !sidebar) return;
        const isCollapsed = sidebar.classList.toggle('collapsed');
        if(mainContent) mainContent.classList.toggle('sidebar-expanded');
        if(isCollapsed) {
            localStorage.setItem('sidebarState', 'collapsed');
            if(toggleIcon) toggleIcon.className = 'fas fa-chevron-left';
            if(toggleText) toggleText.innerText = 'Open';
        } else {
            localStorage.setItem('sidebarState', 'expanded');
            if(toggleIcon) toggleIcon.className = 'fas fa-chevron-right';
            if(toggleText) toggleText.innerText = 'Collapse';
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        loadSpecialModeState();
        if(window.innerWidth > 768 && localStorage.getItem('sidebarState') === 'expanded' && sidebar) {
            sidebar.classList.remove('collapsed'); 
            if(mainContent) mainContent.classList.add('sidebar-expanded');
            if(toggleIcon) toggleIcon.className = 'fas fa-chevron-right';
            if(toggleText) toggleText.innerText = 'Collapse';
        }
    });
</script>
