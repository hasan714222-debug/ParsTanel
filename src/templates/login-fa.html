<html lang="fa">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود</title>
    <link rel="stylesheet" href="static/css/login-fa.css">
    <link rel="stylesheet" href="static/css/font-awesome.min.css">
    <style>
        html,
        body {

<body>
    <div class="main-container">
        <div class="form-container">
            <h1>خوش آمدید</h1>
            <form method="POST" action="/login">
                <!-- <label for="username">نام کاربری</label> -->
                <input type="text" id="username" name="username" placeholder="نام کاربری خود را وارد کنید" required>
                <!-- <label for="password">گذرواژه</label> -->
                <input type="password" id="password" name="password" placeholder="گذرواژه خود را وارد کنید" required>
                <label style="display: block;">
                    <input type="checkbox" name="remember" value="yes"> مرا به خاطر بسپار
                </label>
                <button type="submit">ورود</button>
            </form>

        </div>

        <div class="image-container">
            <img src="{{ url_for('static', filename='logo-login.png') }}" alt="تصویر ورود">
            <div class="footer">
                <p>پنل وایرگارد توسط <a href="https://t.me/parszone_admin" target="_blank">پارس زون</a></p>
            </div>
        </div>

        <!-- 🎯 FLOATING 3D GLASSMORPHIC LANGUAGE TOGGLE SWITCHER -->
        <div class="floating-3d-lang" style="position: fixed; top: 20px; right: 20px; z-index: 10000;">
            <form id="langFormFloating" action="/set-language" method="POST">
                <input type="hidden" name="language" id="langFloatingInput" value="fa">
                <button type="button" onclick="toggleFloatingLang()" style="background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 10px 18px; border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: 0.3s; font-family: 'Vazir', 'Poppins', sans-serif;" onmouseover="this.style.transform='translateY(-3px) scale(1.05)'" onmouseout="this.style.transform='none'">
                    🌐 <span id="langFloatingText">FA</span>
                </button>
            </form>
        </div>
        <script>
            function toggleFloatingLang() {
                const form = document.getElementById("langFormFloating");
                const input = document.getElementById("langFloatingInput");
                const currentLang = "{{ session.get('language', 'en') }}";
                input.value = (currentLang === "fa") ? "en" : "fa";
                form.submit();
            }
            document.addEventListener("DOMContentLoaded", function() {
                const text = document.getElementById("langFloatingText");
                const currentLang = "{{ session.get('language', 'en') }}";
                text.innerText = (currentLang === "fa") ? "EN" : "فارسی";
            });
        </script>
        

    <style>
        .login-popup-err {
            position: fixed; top: 25px; right: 25px; z-index: 99999;
            background: linear-gradient(135deg, #e74c3c, #c0392b); color: #ffffff;
            padding: 14px 22px; border-radius: 12px; font-family: 'Vazir', sans-serif;
            box-shadow: 0 10px 25px rgba(231, 76, 60, 0.45); display: none;
            align-items: center; gap: 12px; direction: rtl; font-size: 14px;
            border: 1px solid rgba(255,255,255,0.2);
            animation: slideInFa 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideInFa {
            from { opacity: 0; transform: translateY(-30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
    <div id="loginAlertModal" class="login-popup-err">
        <i class="fa fa-exclamation-triangle" style="font-size: 20px; color: #ffeb3b;"></i>
        <span id="loginAlertText">خطایی رخ داد.</span>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var form = document.querySelector('form');
        if (form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                var usernameInput = document.getElementById('username');
                var passwordInput = document.getElementById('password');
                var username = usernameInput ? usernameInput.value.trim() : '';
                var password = passwordInput ? passwordInput.value : '';

                if (!username || !password) {
                    showLoginError('لطفاً نام کاربری و کلمه عبور را وارد کنید.');
                    return;
                }

                fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                })
                .then(function(res) {
                    return res.json().then(function(data) {
                        return { status: res.status, body: data };
                    });
                })
                .then(function(result) {
                    if (result.status === 200 && (result.body.message || result.body.role)) {
                        window.location.href = '/home';
                    } else {
                        var errMsg = result.body.error || 'نام کاربری یا کلمه عبور اشتباه است.';
                        showLoginError(errMsg);
                    }
                })
                .catch(function(err) {
                    showLoginError('خطا در برقراری ارتباط با سرور.');
                });
            });
        }
    });

    function showLoginError(msg) {
        var modal = document.getElementById('loginAlertModal');
        var text = document.getElementById('loginAlertText');
        if (modal && text) {
            text.innerText = msg;
            modal.style.display = 'flex';
            setTimeout(function() {
                modal.style.display = 'none';
            }, 4000);
        } else {
            alert(msg);
        }
    }
    </script>
</body>
