<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panel Login | WireGuard</title>
    <link rel="stylesheet" href="/static/css/login.css">
    <link rel="stylesheet" href="/static/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @font-face { font-family: 'Poppins'; src: url('/static/fonts/Poppins-Regular.ttf') format('truetype'); }
        
        * { box-sizing: border-box; }
        html, body {
            background-color: #070709 !important;
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 170, 0, 0.06), transparent 60%) !important;
            font-family: 'Poppins', sans-serif !important;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e0e6ed;
        }

        .main-container {
            display: flex;
            width: 90%;
            max-width: 880px;
            background: rgba(18, 20, 25, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 170, 0, 0.25);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 170, 0, 0.04);
            overflow: hidden;
            position: relative;
        }

        .form-container {
            flex: 1.2;
            padding: 45px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-container h1 {
            font-size: 22px;
            color: #ffaa00;
            margin-bottom: 25px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.3);
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #8b949e;
            font-size: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 13px 14px 13px 40px;
            background: rgba(5, 6, 8, 0.9);
            border: 1px solid rgba(255, 170, 0, 0.3);
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #00f2ff;
            background: #000;
            outline: none;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.35);
        }

        .remember-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8b949e;
            font-size: 12.5px;
            cursor: pointer;
            margin-bottom: 22px;
            user-select: none;
        }

        .remember-label input {
            accent-color: #ffaa00;
            width: 16px;
            height: 16px;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #ffaa00 0%, #ff5252 100%);
            color: #000;
            font-weight: 900;
            font-size: 15px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(255, 170, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 170, 0, 0.55);
            color: #000;
        }

        .image-container {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            position: relative;
        }

        .image-container img {
            max-width: 180px;
            height: auto;
            border-radius: 50%;
            box-shadow: 0 0 35px rgba(255, 170, 0, 0.2);
            margin-bottom: 20px;
        }

        .footer {
            font-size: 12px;
            color: #8b949e;
            text-align: center;
        }

        .footer a {
            color: #00f2ff;
            text-decoration: none;
            font-weight: bold;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Floating Language Switcher */
        .floating-lang {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
        }

        .floating-lang button {
            background: rgba(18, 20, 25, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 255, 0.4);
            color: #00f2ff;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            font-family: inherit;
        }

        .floating-lang button:hover {
            background: #00f2ff;
            color: #000;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.6);
            transform: translateY(-2px);
        }

        /* Error Notification */
        .login-popup-err {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 99999;
            background: #0d1117;
            color: #fff;
            padding: 14px 20px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            border: 1px solid #ff4757;
            animation: slideInEn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideInEn {
            from { opacity: 0; transform: translateY(-30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column-reverse;
                width: 95%;
                margin: 20px 0;
            }
            .image-container {
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                padding: 25px;
            }
            .image-container img {
                max-width: 120px;
                margin-bottom: 10px;
            }
            .form-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>
    <!-- Floating Language Switcher without Emojis -->
    <div class="floating-lang">
        <form id="langFormFloating" action="/set-language" method="POST">
            <input type="hidden" name="language" value="fa">
            <button type="submit">
                <i class="fas fa-globe"></i> <span>فارسی</span>
            </button>
        </form>
    </div>

    <div class="main-container">
        <div class="form-container">
            <h1><i class="fas fa-shield-halved"></i> Panel Authentication</h1>
            <form id="loginForm" method="POST" action="/login">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" name="username" placeholder="Username" required autofocus>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                </div>
                <label class="remember-label">
                    <input type="checkbox" name="remember" value="yes"> Remember Me
                </label>
                <button type="submit" class="btn-login" id="btnLogin">
                    <i class="fas fa-right-to-bracket"></i> Sign In
                </button>
            </form>
        </div>

        <div class="image-container">
            <img src="{{ url_for('static', filename='logo-login.png') }}" alt="Logo">
            <div class="footer">
                <p>Developed by <a href="https://t.me/parszone_admin" target="_blank">PARS ZONE</a></p>
            </div>
        </div>
    </div>

    <!-- Error Notification Popup -->
    <div id="loginAlertModal" class="login-popup-err">
        <i class="fas fa-triangle-exclamation" style="font-size: 18px; color: #ff4757;"></i>
        <span id="loginAlertText">Invalid credentials.</span>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('btnLogin');

        if (form) {
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                if (!username || !password) {
                    showLoginError('Please enter both username and password.');
                    return;
                }

                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

                fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                })
                .then(res => res.json().then(data => ({ status: res.status, body: data })))
                .then(result => {
                    if (result.status === 200 && (result.body.message || result.body.role)) {
                        window.location.href = '/home';
                    } else {
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Sign In';
                        showLoginError(result.body.error || 'Wrong username or password.');
                    }
                })
                .catch(() => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Sign In';
                    showLoginError('Server connection error.');
                });
            });
        }
    });

    function showLoginError(msg) {
        const modal = document.getElementById('loginAlertModal');
        const text = document.getElementById('loginAlertText');
        if (modal && text) {
            text.innerText = msg;
            modal.style.display = 'flex';
            setTimeout(() => { modal.style.display = 'none'; }, 4000);
        } else {
            alert(msg);
        }
    }
    </script>
</body>
</html>
