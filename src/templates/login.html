<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="static/css/font-awesome.min.css">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='images/favicon-16x16.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='images/site.webmanifest') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <link rel="stylesheet" href="static/css/login.css">
    <style>
        html,
        body {
            background-color: #0F0F0F !important;
        }
    </style>

</head>

<body>
    <div class="main-container">
        <div class="form-container">
            <h1>Welcome Back</h1>
            <form method="POST" action="/login">
                <!-- <label for="username">Username</label> -->
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
                <!-- <label for="password">Password</label> -->
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <label style="display: block;">
                    <input type="checkbox" name="remember" value="yes"> Remember Me
                </label>
                <button type="submit">Login</button>
            </form>
        </div>

        <div class="image-container">
            <img src="{{ url_for('static', filename='/logo-login.png') }}" alt="Login Illustration">
            <div class="footer">
                <p>Wireguard Panel by <a href="https://t.me/parszone_admin" target="_blank">𝐏𝐀𝐑𝐒 𝐙𝐎𝐍𝐄</a></p>
            </div>
        </div>
        <!-- <form method="POST" action="/set-language" id="language-form">
            <select name="language" class="language-selector" onchange="document.getElementById('language-form').submit()">
                <option value="en" {% if session['language']=='en' %}selected{% endif %}>English</option>
                <option value="fa" {% if session['language']=='fa' %}selected{% endif %}>فارسی</option>
            </select>
        </form> -->




    </div>


        <!-- 🎯 FLOATING 3D GLASSMORPHIC LANGUAGE TOGGLE SWITCHER -->
        <div class="floating-3d-lang" style="position: fixed; top: 20px; right: 20px; z-index: 10000;">
            <form id="langFormFloating" action="/set-language" method="POST">
                <input type="hidden" name="language" id="langFloatingInput" value="fa">
                <button type="button" onclick="toggleFloatingLang()" style="background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 10px 18px; border-radius: 30px; font-weight: bold; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: 0.3s; font-family: 'Vazir', 'Poppins', sans-serif;" onmouseover="this.style.transform='translateY(-3px) scale(1.05)'" onmouseout="this.style.transform='none'">
                    🌐 <span id="langFloatingText">FA</span>
                </button>
            </form>
        </div>
        <script>
            function toggleFloatingLang() {
                const form = document.getElementById("langFormFloating");
                const input = document.getElementById("langFloatingInput");
                const currentLang = "{{ session.get('language', 'en') }}";
                input.value = (currentLang === "fa") ? "en" : "fa";
                form.submit();
            }
            document.addEventListener("DOMContentLoaded", function() {
                const text = document.getElementById("langFloatingText");
                const currentLang = "{{ session.get('language', 'en') }}";
                text.innerText = (currentLang === "fa") ? "EN" : "فارسی";
            });
        </script>
        
</body>

</html>
