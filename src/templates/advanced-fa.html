<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت پیشرفته پروکسی | پنل وایرگارد</title>
    <link rel="stylesheet" href="/static/css/style-fa.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .adv-container { max-width: 1050px; margin: 20px auto; padding: 15px; }
        .adv-card { background: rgba(13, 17, 23, 0.85); border: 1px solid #00f2ff; border-radius: 18px; padding: 25px; margin-bottom: 25px; box-shadow: 0 0 30px rgba(0,242,255,0.15); }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 20px; }
        .srv-card-btn { 
            background: rgba(18, 22, 30, 0.9); border: 1px solid rgba(0,242,255,0.3); color: #fff; 
            padding: 16px; border-radius: 14px; cursor: pointer; text-align: center; 
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); display: flex; flex-direction: column; 
            justify-content: space-between; gap: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .srv-card-btn:hover { 
            background: rgba(0,242,255,0.15); border-color: #00f2ff; 
            transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,242,255,0.3); 
        }
        .ping-badge { font-family: monospace; font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: bold; background: rgba(0,0,0,0.6); display: inline-block; }
    </style>
</head>
<body>
    {% include "sidebar-fa.html" %}

    <div class="main-content">
        <div class="adv-container">
            
            <!-- سوئیچ روشن / خاموش حالت پیشرفته -->
            <div class="adv-card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <div>
                    <h3 style="color: #00f2ff; margin: 0 0 6px 0; font-size: 18px;">
                        <i class="fas fa-power-off" style="color: #ffaa00;"></i> وضعیت سراسری حالت پیشرفته
                    </h3>
                    <p style="color: #8b949e; font-size: 12px; margin: 0; line-height: 1.6;">
                        در صورت فعال بودن، ساب‌لینک‌ها فقط کانفیگ‌های متصل به پروکسی را نمایش داده و ترافیک کاربران به صورت تجمیعی از تمام پورت‌ها محاسبه می‌شود.
                    </p>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span id="advStatusLabel" style="font-weight: bold; font-size: 14px; color: #ff4757;">خاموش 🔴</span>
                    <label class="switch" style="position: relative; display: inline-block; width: 52px; height: 28px; margin: 0;">
                        <input type="checkbox" id="advModeToggle" onchange="toggleAdvModeLive()">
                        <span class="slider round" id="advModeSlider" style="position: absolute; cursor: pointer; top:0; left:0; right:0; bottom:0; background-color: #333; transition: .4s; border-radius: 34px;"></span>
                    </label>
                </div>
            </div>

            <!-- دکمه افزودن سرویس جدید -->
            <div style="text-align: center; margin-bottom: 25px;">
                <button type="button" class="btn" onclick="openAdvServiceModal()" style="background: linear-gradient(135deg, #00f2ff, #10b981); color: #000; font-weight: 900; padding: 14px 32px; border-radius: 12px; font-size: 15px; border: none; cursor: pointer; box-shadow: 0 0 20px rgba(0,242,255,0.3);">
                    ➕ اضافه کردن سرویس جدید
                </button>
            </div>

            <!-- لیست پلن‌های فعال با وضعیت پینگ ۳ دقیقه‌ای -->
            <div class="adv-card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h4 style="color: #ffaa00; margin: 0; font-size: 16px;">
                        <i class="fas fa-server"></i> سرویس‌های پیشرفته (پایش خودکار هر ۳ دقیقه):
                    </h4>
                    <button onclick="loadAdvServicesList()" class="btn" style="padding: 6px 12px; font-size: 11px; background: rgba(0,242,255,0.1); border: 1px solid #00f2ff; color: #00f2ff; border-radius: 6px; cursor: pointer;">
                        <i class="fas fa-sync-alt"></i> به‌روزرسانی لایو
                    </button>
                </div>
                <div id="advServicesGrid" class="services-grid"></div>
            </div>

        </div>
    </div>

    <!-- مدال شناور تنظیمات سرویس -->
    <div id="advModal" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 100000; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box;">
        <div style="background: #0d1117; width: 100%; max-width: 520px; padding: 30px; border-radius: 24px; border: 1px solid #00f2ff; max-height: 90vh; overflow-y: auto; position: relative; box-sizing: border-box;">
            <span style="position: absolute; left: 20px; top: 20px; font-size: 28px; color: #ff4757; cursor: pointer; font-weight: bold;" onclick="closeAdvModal()">&times;</span>
            <h3 style="color: #00f2ff; margin-top: 0; margin-bottom: 20px;" id="modalTitle">تنظیمات سرویس پیشرفته</h3>
            
            <form id="advServiceForm" onsubmit="saveAdvService(event)">
                <input type="hidden" id="advId">
                <div class="form-group">
                    <label style="color:#ffaa00; font-weight:bold;">متن کانفیگ پروکسی (X-UI / WireGuard):</label>
                    <textarea id="advProxy" required placeholder="متن کامل کانفیگ یا لینک پروکسی..." style="width:100%; height:90px; background:#050608; border:1px solid #333; color:#00ffaa; font-family:monospace; font-size:11px; padding:10px; border-radius:8px; box-sizing:border-box;"></textarea>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                    <div class="form-group"><label>نام سرور:</label><input type="text" id="advName" required placeholder="مثال: سرور ترکیه"></div>
                    <div class="form-group"><label>ایموجی پرچم:</label><input type="text" id="advFlag" placeholder="مثال: 🇹🇷"></div>
                </div>
                <div class="form-group"><label>توضیحات پلن:</label><input type="text" id="advDesc" placeholder="توضیحات کوتاه برای نمایش در ساب‌لینک"></div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                    <div class="form-group"><label>دامنه / Endpoint:</label><input type="text" id="advDomain" required placeholder="wg.domain.com"></div>
                    <div class="form-group"><label>پورت اختصاصی:</label><input type="number" id="advPort" required placeholder="51830"></div>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                    <div class="form-group"><label>پسوند نام فایل:</label><input type="text" id="advSuffix" placeholder="مثال: -TR یا _Gaming"></div>
                    <div class="form-group"><label>MTU:</label><input type="number" id="advMTU" value="1420"></div>
                </div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                    <div class="form-group"><label>DNS:</label><input type="text" id="advDNS" value="1.1.1.1, 1.0.0.1"></div>
                    <div class="form-group"><label>Persistent Keepalive:</label><input type="number" id="advKeepalive" value="25"></div>
                </div>
                <div class="form-group"><label>Allowed IPs:</label><input type="text" id="advAllowed" value="0.0.0.0/0, ::/0"></div>

                <div style="display:flex; gap:10px; margin-top:22px;">
                    <button type="submit" class="btn" style="flex:2; background:#10b981; color:#000; font-weight:bold; padding:12px; border-radius:8px; border:none; cursor:pointer;">💾 ذخیره سرویس</button>
                    <button type="button" id="btnDeleteAdv" onclick="deleteAdvService()" style="flex:1; background:#ff4757; color:#fff; font-weight:bold; padding:12px; border-radius:8px; border:none; cursor:pointer; display:none;">🗑 حذف پلن</button>
                </div>
            </form>
        </div>
    </div>

    <script>
    let globalAdvServices = [];

    async function loadAdvState() {
        try {
            const res = await fetch("/api/advanced-mode-status");
            const data = await res.json();
            const toggle = document.getElementById("advModeToggle");
            const slider = document.getElementById("advModeSlider");
            const label = document.getElementById("advStatusLabel");
            if (toggle && data) {
                toggle.checked = data.enabled;
                slider.style.backgroundColor = data.enabled ? "#10b981" : "#333";
                label.innerHTML = data.enabled ? "روشن 🟢" : "خاموش 🔴";
                label.style.color = data.enabled ? "#00ffaa" : "#ff4757";
            }
        } catch(e) {}
        loadAdvServicesList();
    }

    async function toggleAdvModeLive() {
        const toggle = document.getElementById("advModeToggle");
        await fetch("/api/advanced-mode-status", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({enabled: toggle.checked})
        });
        loadAdvState();
    }

    async function loadAdvServicesList() {
        try {
            const res = await fetch("/api/advanced-services");
            globalAdvServices = await res.json();
            const grid = document.getElementById("advServicesGrid");
            grid.innerHTML = "";
            
            if (!globalAdvServices || globalAdvServices.length === 0) {
                grid.innerHTML = "<div style='color:#8b949e; font-size:13px;'>هیچ سرویس پیشرفته‌ای تعریف نشده است.</div>";
                return;
            }

            globalAdvServices.forEach(s => {
                const btn = document.createElement("div");
                btn.className = "srv-card-btn";
                
                const pingText = s.last_ping || "در حال ارزیابی...";
                
                btn.innerHTML = `
                    <div style="font-size: 16px; font-weight: bold; color: #00f2ff;">
                        ${s.flag || '🌐'} ${s.name}
                    </div>
                    <div style="font-size: 12px; color: #8b949e; font-family: monospace;">
                        Port: <b style="color:#ffaa00;">${s.port}</b> | Domain: <b>${s.domain}</b>
                    </div>
                    <div>
                        <span class="ping-badge">${pingText}</span>
                    </div>
                `;
                btn.onclick = () => openEditAdvModal(s.id);
                grid.appendChild(btn);
            });
        } catch(e) {}
    }

    function openAdvServiceModal() {
        document.getElementById("advServiceForm").reset();
        document.getElementById("advId").value = "";
        document.getElementById("advPort").disabled = false;
        document.getElementById("btnDeleteAdv").style.display = "none";
        document.getElementById("modalTitle").innerText = "اضافه کردن سرویس جدید";
        document.getElementById("advModal").style.display = "flex";
    }

    function openEditAdvModal(id) {
        const s = globalAdvServices.find(x => x.id === id);
        if(!s) return;
        document.getElementById("advId").value = s.id;
        document.getElementById("advName").value = s.name;
        document.getElementById("advFlag").value = s.flag;
        document.getElementById("advDesc").value = s.description;
        document.getElementById("advSuffix").value = s.suffix;
        document.getElementById("advProxy").value = s.proxy_config;
        document.getElementById("advDomain").value = s.domain;
        document.getElementById("advPort").value = s.port;
        document.getElementById("advPort").disabled = true; // غیرقابل ویرایش بودن پورت جهت جلوگیری از تداخل کارت شبکه
        document.getElementById("advDNS").value = s.dns;
        document.getElementById("advMTU").value = s.mtu;
        document.getElementById("advKeepalive").value = s.persistent_keepalive;
        document.getElementById("advAllowed").value = s.allowed_ips;
        document.getElementById("btnDeleteAdv").style.display = "block";
        document.getElementById("modalTitle").innerText = `ویرایش سرویس ${s.name}`;
        document.getElementById("advModal").style.display = "flex";
    }

    function closeAdvModal() {
        document.getElementById("advModal").style.display = "none";
    }

    async function saveAdvService(e) {
        e.preventDefault();
        const payload = {
            id: document.getElementById("advId").value || null,
            name: document.getElementById("advName").value,
            flag: document.getElementById("advFlag").value,
            description: document.getElementById("advDesc").value,
            suffix: document.getElementById("advSuffix").value,
            proxy_config: document.getElementById("advProxy").value,
            domain: document.getElementById("advDomain").value,
            port: parseInt(document.getElementById("advPort").value),
            dns: document.getElementById("advDNS").value,
            mtu: parseInt(document.getElementById("advMTU").value),
            persistent_keepalive: parseInt(document.getElementById("advKeepalive").value),
            allowed_ips: document.getElementById("advAllowed").value
        };
        const res = await fetch("/api/advanced-services", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if(res.ok) {
            alert(data.message);
            closeAdvModal();
            loadAdvServicesList();
        } else {
            alert(data.error);
        }
    }

    async function deleteAdvService() {
        const id = document.getElementById("advId").value;
        if(!id || !confirm("آیا از حذف دائم این پلن و اینترفیس مطمئن هستید؟")) return;
        const res = await fetch(`/api/advanced-services?id=${id}`, {method: "DELETE"});
        const data = await res.json();
        alert(data.message);
        closeAdvModal();
        loadAdvServicesList();
    }

    // بازخوانی زنده کارت‌ها هر ۱۰ ثانیه
    document.addEventListener("DOMContentLoaded", () => {
        loadAdvState();
        setInterval(loadAdvServicesList, 10000);
    });
    </script>
</body>
</html>
