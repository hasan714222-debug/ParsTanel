<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت سرویس‌های پیشرفته | WireGuard</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/style-fa.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-dark">
    <div class="main-container">
        {% include "sidebar-fa.html" %}
        
        <div class="content-wrapper" style="padding: 25px;">
            <div class="card" style="background: rgba(18, 20, 25, 0.85); border: 1px solid #00f2ff; border-radius: 16px; padding: 25px; margin-bottom: 25px;">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px; border-bottom: 1px dashed rgba(0,242,255,0.2); padding-bottom: 15px;">
                    <div>
                        <h2 style="color: #00f2ff; margin: 0; font-size: 18px;"><i class="fas fa-bolt"></i> وضعیت سراسری حالت پیشرفته (Advanced Mode)</h2>
                        <p style="color: #8b949e; font-size: 12px; margin: 5px 0 0 0;">در صورت روشن بودن، ساب‌لینک‌ها فقط پلن‌های متصل به پروکسی را ارائه می‌دهند.</p>
                    </div>
                    <label class="switch" style="position: relative; display: inline-block; width: 50px; height: 26px;">
                        <input type="checkbox" id="advModeToggle" onchange="toggleAdvModeLive()">
                        <span class="slider round" style="position: absolute; cursor: pointer; top:0; left:0; right:0; bottom:0; background-color: #333; transition: .4s; border-radius: 34px;"></span>
                    </label>
                </div>

                <div style="margin-top: 20px; display: flex; justify-content: flex-end;">
                    <button type="button" onclick="openServiceModal()" class="btn btn-primary" style="background: linear-gradient(135deg, #00f2ff 0%, #10b981 100%); color:#000; font-weight:bold;">
                        ➕ اضافه کردن سرویس جدید
                    </button>
                </div>
            </div>

            <!-- گرید نمایش سرویس‌های پیشرفته -->
            <div id="servicesGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;"></div>
        </div>
    </div>

    <!-- مدال شناور اضافه / ویرایش سرویس -->
    <div id="serviceModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 100000; align-items: center; justify-content: center;">
        <div style="background: #0d1117; width: 95%; max-width: 520px; padding: 30px; border-radius: 20px; border: 1px solid #00f2ff; box-shadow: 0 0 35px rgba(0,242,255,0.2); max-height: 90vh; overflow-y: auto; text-align: right;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
                <h3 id="modalTitle" style="color: #00f2ff; margin: 0; font-size: 16px;">➕ تعریف سرویس و پروکسی جدید</h3>
                <span onclick="closeServiceModal()" style="color: #ff4757; font-size: 26px; cursor: pointer; font-weight: bold;">&times;</span>
            </div>

            <form id="advServiceForm" onsubmit="saveAdvService(event)">
                <input type="hidden" id="srvId">
                <div class="form-group"><label>نام سرور / پلن:</label><input type="text" id="srvName" required placeholder="مثال: سرور ترکیه گیمینگ"></div>
                <div class="form-group"><label>ایموجی پرچم لوکیشن:</label><input type="text" id="srvFlag" value="🇹🇷" required></div>
                <div class="form-group"><label>توضیحات پلن:</label><input type="text" id="srvDesc" placeholder="مثال: مناسب ترید، بازی و یوتیوب"></div>
                <div class="form-group"><label>پسوند فایل کانفیگ:</label><input type="text" id="srvSuffix" placeholder="مثال: _TR یا -Gaming"></div>
                <div class="form-group"><label>دامنه یا آی‌پی Endpoint:</label><input type="text" id="srvDomain" required placeholder="مثال: tr.domain.com"></div>
                <div class="form-group"><label>پورت اختصاصی WireGuard:</label><input type="number" id="srvPort" required placeholder="51830"></div>
                
                <div class="form-group">
                    <label>کانفیگ پروکسی مقصد (متن کامل کانفیگ وایرگارد یا VLESS):</label>
                    <textarea id="srvProxyConfig" style="width: 100%; height: 110px; background: #050608; border: 1px solid #30363d; color: #00ffaa; border-radius: 8px; font-family: monospace; font-size: 11px; padding: 10px;"></textarea>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group"><label>MTU:</label><input type="number" id="srvMtu" value="1420"></div>
                    <div class="form-group"><label>DNS:</label><input type="text" id="srvDns" value="1.1.1.1, 1.0.0.1"></div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="submit" class="btn btn-cyber btn-cyber-green" style="flex: 1; padding: 12px;">💾 ذخیره و استقرار سرویس</button>
                    <button type="button" id="btnDeleteSrv" onclick="deleteAdvService()" class="btn btn-danger" style="display: none; padding: 12px;">🗑 حذف</button>
                </div>
            </form>
        </div>
    </div>

    <script>
    let servicesCache = [];

    async function loadAdvModeStatus() {
        const res = await fetch("/api/advanced-mode-status");
        const data = await res.json();
        document.getElementById("advModeToggle").checked = !!data.enabled;
    }

    async function toggleAdvModeLive() {
        const enabled = document.getElementById("advModeToggle").checked;
        await fetch("/api/advanced-mode-status", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({enabled: enabled})
        });
    }

    async function loadServices() {
        const res = await fetch("/api/advanced-services");
        servicesCache = await res.json();
        const grid = document.getElementById("servicesGrid");
        grid.innerHTML = "";

        servicesCache.forEach(s => {
            const card = document.createElement("div");
            card.className = "card";
            card.style.cssText = "background: rgba(18, 20, 25, 0.8); border: 1px solid rgba(0,242,255,0.3); border-radius: 12px; padding: 20px; text-align: right;";
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
                    <h3 style="color:#00f2ff; margin:0; font-size:16px;">${s.flag} ${s.name}</h3>
                    <span style="color:#ffaa00; font-size:12px; font-family:monospace;">${s.interface_name}</span>
                </div>
                <div style="font-size:12px; color:#8b949e; line-height: 1.8;">
                    <div>🌐 <b>Endpoint:</b> ${s.domain}:${s.port}</div>
                    <div>🏷 <b>پسوند:</b> <code>${s.suffix || 'ندارد'}</code></div>
                    <div>📝 <b>توضیح:</b> ${s.description || 'ندارد'}</div>
                </div>
                <button onclick="editService(${s.id})" class="btn" style="width:100%; margin-top:15px; border:1px solid #00f2ff; color:#00f2ff; background:rgba(0,242,255,0.08);">⚙️ ویرایش و پیکربندی</button>
            `;
            grid.appendChild(card);
        });
    }

    function openServiceModal() {
        document.getElementById("advServiceForm").reset();
        document.getElementById("srvId").value = "";
        document.getElementById("srvPort").disabled = false;
        document.getElementById("btnDeleteSrv").style.display = "none";
        document.getElementById("modalTitle").innerText = "➕ تعریف سرویس و پروکسی جدید";
        document.getElementById("serviceModal").style.display = "flex";
    }

    function closeServiceModal() {
        document.getElementById("serviceModal").style.display = "none";
    }

    function editService(id) {
        const s = servicesCache.find(x => x.id === id);
        if (!s) return;
        document.getElementById("srvId").value = s.id;
        document.getElementById("srvName").value = s.name;
        document.getElementById("srvFlag").value = s.flag;
        document.getElementById("srvDesc").value = s.description;
        document.getElementById("srvSuffix").value = s.suffix;
        document.getElementById("srvDomain").value = s.domain;
        document.getElementById("srvPort").value = s.port;
        document.getElementById("srvPort").disabled = true; // پورت غیرقابل تغییر است
        document.getElementById("srvProxyConfig").value = s.proxy_config;
        document.getElementById("srvMtu").value = s.mtu;
        document.getElementById("srvDns").value = s.dns;
        document.getElementById("btnDeleteSrv").style.display = "block";
        document.getElementById("modalTitle").innerText = "⚙️ ویرایش سرویس پیشرفته";
        document.getElementById("serviceModal").style.display = "flex";
    }

    async function saveAdvService(e) {
        e.preventDefault();
        const payload = {
            id: document.getElementById("srvId").value || null,
            name: document.getElementById("srvName").value,
            flag: document.getElementById("srvFlag").value,
            description: document.getElementById("srvDesc").value,
            suffix: document.getElementById("srvSuffix").value,
            domain: document.getElementById("srvDomain").value,
            port: document.getElementById("srvPort").value,
            proxy_config: document.getElementById("srvProxyConfig").value,
            mtu: document.getElementById("srvMtu").value,
            dns: document.getElementById("srvDns").value
        };

        const res = await fetch("/api/advanced-services", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
            closeServiceModal();
            loadServices();
        } else {
            alert(data.error || "خطا در ذخیره");
        }
    }

    async function deleteAdvService() {
        const id = document.getElementById("srvId").value;
        if (!id || !confirm("آیا از حذف این پلن و متوقف‌سازی اینترفیس اطمینان دارید؟")) return;
        await fetch(`/api/advanced-services?id=${id}`, { method: "DELETE" });
        closeServiceModal();
        loadServices();
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadAdvModeStatus();
        loadServices();
    });
    </script>
</body>
</html>
